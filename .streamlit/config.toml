# Visual theme for the web app: near-black background, mint accent, Inter type.

[theme]
base = "dark"
primaryColor = "#3DDC97"
backgroundColor = "#06090A"
secondaryBackgroundColor = "#0E1614"
textColor = "#F2F5F4"
linkColor = "#3DDC97"
borderColor = "#1D2925"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 600]
baseRadius = "0.75rem"
buttonRadius = "full"
dataframeHeaderBackgroundColor = "#0E1614"
chartCategoricalColors = ["#3DDC97", "#7AA7FF", "#F5B85C", "#E8738A", "#B392F0"]

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
